name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2025
            archive: zip
            installer: msi
            ntvcm: ntvcm.exe
          - target: windows-arm64
            os: windows-11-arm
            archive: zip
            installer: msi
            ntvcm: ntvcm.exe
          - target: linux-x64
            os: ubuntu-24.04
            archive: tar.gz
            installer: deb
            ntvcm: ntvcm
          - target: linux-arm64
            os: ubuntu-24.04-arm
            archive: tar.gz
            installer: deb
            ntvcm: ntvcm
          - target: macos-apple-silicon
            os: macos-15
            archive: tar.gz
            installer: pkg
            ntvcm: ntvcm
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
      PACKAGE_NAME: dcc-cpm-z80-${{ github.event.inputs.version || github.ref_name }}-${{ matrix.target }}
    steps:
      - name: Checkout dcc
        uses: actions/checkout@v4

      - name: Checkout ntvcm emulator
        uses: actions/checkout@v4
        with:
          repository: davidly/ntvcm
          path: ntvcm

      - name: Build ntvcm emulator on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: ntvcm
        run: |
          $vcvarsName = if ('${{ matrix.target }}' -eq 'windows-arm64') { 'vcvarsarm64.bat' } else { 'vcvars64.bat' }
          $component = if ('${{ matrix.target }}' -eq 'windows-arm64') { 'Microsoft.VisualStudio.Component.VC.Tools.ARM64' } else { 'Microsoft.VisualStudio.Component.VC.Tools.x86.x64' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          $installPath = & $vswhere -latest -products * -requires $component -property installationPath
          if (-not $installPath) { throw "Visual Studio C++ tools not found for ${{ matrix.target }}" }

          $vcvars = Join-Path $installPath "VC\Auxiliary\Build\$vcvarsName"
          if (-not (Test-Path $vcvars)) { throw "MSVC environment script not found: $vcvars" }

          $buildBat = Join-Path $env:RUNNER_TEMP 'build-ntvcm.bat'
          $buildLines = @(
            "call `"$vcvars`"",
            'if errorlevel 1 exit /b %errorlevel%',
            'cl /nologo ntvcm.cxx x80.cxx /I. /GS- /GL /Oti2 /Ob3 /EHsc /Zi /link user32.lib /OPT:REF /OUT:ntvcm.exe',
            'exit /b %errorlevel%'
          )
          Set-Content -LiteralPath $buildBat -Value $buildLines -Encoding ascii

          & cmd /c "`"$buildBat`""
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build ntvcm emulator on Linux
        if: runner.os == 'Linux'
        working-directory: ntvcm
        run: |
          g++ -O3 -fno-builtin -D NDEBUG -I . ntvcm.cxx x80.cxx -o ntvcm -static

      - name: Build ntvcm emulator on macOS
        if: runner.os == 'macOS'
        working-directory: ntvcm
        run: |
          clang++ -O3 -fno-builtin -D NDEBUG -I . ntvcm.cxx x80.cxx -o ntvcm

      - name: Build dcc host tools
        shell: pwsh
        run: ./scripts/build-dcc.ps1

      - name: Sign Windows binaries
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
        run: |
          if (-not $env:WINDOWS_CODESIGN_PFX_BASE64 -or -not $env:WINDOWS_CODESIGN_PASSWORD) {
            Write-Host "Skipping Windows binary signing because WINDOWS_CODESIGN_PFX_BASE64 or WINDOWS_CODESIGN_PASSWORD is not configured."
            return
          }

          $timestampUrl = if ($env:WINDOWS_CODESIGN_TIMESTAMP_URL) { $env:WINDOWS_CODESIGN_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))

          $signToolPath = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signToolPath) {
            $signToolPath = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Sort-Object FullName -Descending |
              Select-Object -First 1).FullName
          }
          if (-not $signToolPath) { throw "signtool.exe was not found." }

          foreach ($file in @("dcc.exe", "dccpeep.exe", "dccrtlstrip.exe", "ntvcm/${{ matrix.ntvcm }}")) {
            if (Test-Path -LiteralPath $file) {
              & $signToolPath sign /fd SHA256 /tr $timestampUrl /td SHA256 /f $pfxPath /p $env:WINDOWS_CODESIGN_PASSWORD $file
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Package release directory
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 `
            -PackageName "$env:PACKAGE_NAME" `
            -NtvcmPath "ntvcm/${{ matrix.ntvcm }}" `
            -OutputDir dist `
            -Version "$env:RELEASE_VERSION"

      - name: Create zip archive
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive -Path "dist/$env:PACKAGE_NAME" -DestinationPath "dist/$env:PACKAGE_NAME.zip" -Force

      - name: Create tar.gz archive
        if: matrix.archive == 'tar.gz'
        run: tar -czf "dist/$PACKAGE_NAME.tar.gz" -C dist "$PACKAGE_NAME"

      - name: Set up .NET for WiX
        if: runner.os == 'Windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.x

      - name: Install WiX Toolset
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          $dotnetTools = Join-Path $env:USERPROFILE '.dotnet\tools'
          Add-Content -Path $env:GITHUB_PATH -Value $dotnetTools
          & (Join-Path $dotnetTools 'wix.exe') --version

      - name: Create native installer
        shell: pwsh
        run: |
          ./scripts/package-native-installer.ps1 `
            -PackageName "$env:PACKAGE_NAME" `
            -PackageRoot "dist/$env:PACKAGE_NAME" `
            -Target "${{ matrix.target }}" `
            -OutputDir dist `
            -Version "$env:RELEASE_VERSION"

      - name: Sign Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
        run: |
          if (-not $env:WINDOWS_CODESIGN_PFX_BASE64 -or -not $env:WINDOWS_CODESIGN_PASSWORD) {
            Write-Host "Skipping Windows installer signing because WINDOWS_CODESIGN_PFX_BASE64 or WINDOWS_CODESIGN_PASSWORD is not configured."
            return
          }

          $timestampUrl = if ($env:WINDOWS_CODESIGN_TIMESTAMP_URL) { $env:WINDOWS_CODESIGN_TIMESTAMP_URL } else { "http://timestamp.digicert.com" }
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_CODESIGN_PFX_BASE64))

          $signToolPath = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signToolPath) {
            $signToolPath = (Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Sort-Object FullName -Descending |
              Select-Object -First 1).FullName
          }
          if (-not $signToolPath) { throw "signtool.exe was not found." }

          $msiPath = "dist/$env:PACKAGE_NAME.msi"
          & $signToolPath sign /fd SHA256 /tr $timestampUrl /td SHA256 /f $pfxPath /p $env:WINDOWS_CODESIGN_PASSWORD $msiPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: |
            dist/${{ env.PACKAGE_NAME }}.${{ matrix.archive }}
            dist/${{ env.PACKAGE_NAME }}.${{ matrix.installer }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: dcc ${{ github.event.inputs.version || github.ref_name }}
          files: release-assets/*
          generate_release_notes: true