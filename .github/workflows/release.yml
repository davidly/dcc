name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v1.0.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x64
            os: windows-2025
            archive: zip
            ntvcm: ntvcm.exe
          - target: windows-arm64
            os: windows-11-arm
            archive: zip
            ntvcm: ntvcm.exe
          - target: linux-x64
            os: ubuntu-24.04
            archive: tar.gz
            ntvcm: ntvcm
          - target: linux-arm64
            os: ubuntu-24.04-arm
            archive: tar.gz
            ntvcm: ntvcm
          - target: macos-apple-silicon
            os: macos-15
            archive: tar.gz
            ntvcm: ntvcm
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ github.event.inputs.version || github.ref_name }}
      PACKAGE_NAME: dcc-cpm-z80-${{ github.event.inputs.version || github.ref_name }}-${{ matrix.target }}
    steps:
      - name: Checkout dcc
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.version || github.ref }}
          fetch-depth: 0

      - name: Checkout ntvcm emulator
        uses: actions/checkout@v4
        with:
          repository: davidly/ntvcm
          path: ntvcm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build ntvcm emulator on Windows
        if: runner.os == 'Windows'
        shell: python
        env:
          DCC_RELEASE_TARGET: ${{ matrix.target }}
        run: |
          import os, subprocess, sys
          arch = 'arm64' if os.environ['DCC_RELEASE_TARGET'].endswith('arm64') else 'x64'
          subprocess.run([sys.executable, 'scripts/ci_tools.py', 'build-ntvcm', '--release', '--arch', arch], check=True)

      - name: Build ntvcm emulator on Linux
        if: runner.os == 'Linux'
        working-directory: ntvcm
        run: |
          g++ -O3 -fno-builtin -D NDEBUG -I . ntvcm.cxx x80.cxx -o ntvcm -static

      - name: Build ntvcm emulator on macOS
        if: runner.os == 'macOS'
        working-directory: ntvcm
        run: |
          clang++ -O3 -fno-builtin -D NDEBUG -I . ntvcm.cxx x80.cxx -o ntvcm

      - name: Build dcc host tools
        shell: bash
        run: python scripts/build-dcc.py

      - name: Check release version and assembly provenance
        shell: bash
        run: python scripts/test-tool-version.py --expected "$RELEASE_VERSION"

      - name: Sign Windows binaries
        if: runner.os == 'Windows'
        shell: python
        env:
          WINDOWS_CODESIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODESIGN_PFX_BASE64 }}
          WINDOWS_CODESIGN_PASSWORD: ${{ secrets.WINDOWS_CODESIGN_PASSWORD }}
          WINDOWS_CODESIGN_TIMESTAMP_URL: ${{ vars.WINDOWS_CODESIGN_TIMESTAMP_URL }}
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/ci_tools.py', 'sign',
              'dcc.exe', 'dccpeep.exe', 'dccrtlstrip.exe', 'dccmake.exe',
              'm80c.exe', 'l80c.exe', 'ntvcm/ntvcm.exe'], check=True)

      - name: Package release directory and archive
        shell: python
        env:
          DCC_ARCHIVE: ${{ matrix.archive }}
          DCC_NTVCM: ${{ matrix.ntvcm }}
        run: |
          import os, subprocess, sys
          subprocess.run([sys.executable, 'scripts/package-release.py',
              '--package-name', os.environ['PACKAGE_NAME'],
              '--ntvcm-path', 'ntvcm/' + os.environ['DCC_NTVCM'],
              '--output-dir', 'dist', '--version', os.environ['RELEASE_VERSION'],
              '--archive', os.environ['DCC_ARCHIVE']], check=True)

      - name: Upload release package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE_NAME }}
          path: dist/${{ env.PACKAGE_NAME }}.${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Download release packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.version || github.ref_name }}
          name: dcc ${{ github.event.inputs.version || github.ref_name }}
          files: release-assets/*
          generate_release_notes: true
