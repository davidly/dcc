name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-regressions:
    name: Standard regressions (${{ matrix.os }})
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - name: Checkout dcc
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout ntvcm emulator
        uses: actions/checkout@v4
        with:
          repository: davidly/ntvcm
          path: ntvcm

      - name: Build ntvcm emulator on Linux
        if: runner.os == 'Linux'
        run: |
          chmod +x ./m.sh
          ./m.sh
        working-directory: ntvcm

      - name: Build ntvcm emulator on macOS
        if: runner.os == 'macOS'
        run: |
          chmod +x ./mmac.sh
          ./mmac.sh
        working-directory: ntvcm

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build ntvcm emulator on Windows
        if: runner.os == 'Windows'
        shell: python
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, 'scripts/ci_tools.py', 'build-ntvcm'], check=True)

      - name: Add tool directories to PATH
        shell: python
        run: |
          import os
          from pathlib import Path
          with open(os.environ['GITHUB_PATH'], 'a') as output:
              output.write(str(Path('.').resolve()) + '\n')
              output.write(str(Path('ntvcm').resolve()) + '\n')

      - name: Build dcc host tools
        shell: bash
        run: python scripts/build-dcc.py

      - name: Test native build driver
        shell: bash
        run: python -m unittest scripts.tests.test_build_dcc scripts.tests.test_ma scripts.tests.test_dccprof scripts.tests.test_prepush scripts.tests.test_validate_unit_test scripts.tests.test_runall_build_diagnostics scripts.tests.test_runall_tool_fixtures scripts.tests.test_runall_batches scripts.tests.test_mir_fuzz_source scripts.tests.test_process_supervision_python scripts.tests.test_mir_compiler_mutations.CampaignPolicyTests scripts.tests.test_mir_proof_suite scripts.tests.test_mir_probes scripts.tests.test_mir_clobber_runner scripts.tests.test_diagnostics scripts.tests.test_remaining_migrations

      - name: Run main regression suite in both optimization modes
        # tdvbyte exhaustively checks 17,432,576 inputs through two helpers.
        # Hosted runners can exceed 60s under parallel load.
        run: python scripts/runall.py --mode full --timeout 300
