name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests and extended suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout dcc
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout ntvcm emulator
        uses: actions/checkout@v4
        with:
          repository: davidly/ntvcm
          path: ntvcm

      - name: Set up MSVC dev environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build ntvcm emulator (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x ./m.sh
          ./m.sh
        working-directory: ntvcm

      - name: Build ntvcm emulator (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: m.bat
        working-directory: ntvcm

      - name: Add tool directories to PATH
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_PATH -Value $env:GITHUB_WORKSPACE
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:GITHUB_WORKSPACE "ntvcm")

      - name: Build dcc host tools
        shell: pwsh
        run: ./scripts/build-dcc.ps1

      - name: Run unit tests and extended suite
        shell: pwsh
        run: ./scripts/runall.ps1 -Mode full -Extended -RunTimeout 20
